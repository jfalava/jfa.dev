name: Deploy Alchemy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Alchemy stage to plan or deploy
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      apply:
        description: Apply the plan after validation (production requires environment approval)
        required: true
        default: false
        type: boolean

concurrency:
  group: alchemy-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    permissions:
      contents: read
    env:
      ALCHEMY_STAGE: ${{ inputs.stage }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck infrastructure
        run: bun run --filter @jfa.dev/iac typecheck

      - name: Lint infrastructure
        run: bun run --filter @jfa.dev/iac lint

      - name: Inspect Alchemy plan
        run: bun run --filter @jfa.dev/iac plan

      - name: Apply Alchemy plan
        if: ${{ inputs.apply }}
        run: bun run --filter @jfa.dev/iac deploy

